<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PACKTOOK V4 Firebase Staging</title><style>body{font:16px system-ui;background:#061b3a;margin:0;color:#102343}main{max-width:660px;margin:48px auto;padding:28px;background:white;border-radius:20px}input,button{font:inherit;padding:12px;margin:5px 0;border-radius:9px}input{box-sizing:border-box;width:100%;border:1px solid #d2dcef}button{background:#126be4;color:white;border:none;cursor:pointer}.row{display:flex;flex-wrap:wrap;gap:8px}pre{white-space:pre-wrap;background:#edf5ff;padding:16px;border-radius:12px}</style></head><body><main><h1>PACK<span style="color:#00aefa">TOOK</span> — Firebase V4 Staging</h1><p>ระบบทดสอบ Auth + เครดิตฝั่ง Server (ยังไม่เชื่อมกล้องและไม่ใช่ระบบชำระเงินจริง)</p><section id="authPanel"><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password (12+ characters)</label><input id="password" type="password" autocomplete="current-password"><div class="row"><button id="signup">สมัครสมาชิก</button><button id="login">Login</button><button id="reset">Reset Password</button></div></section><section id="usagePanel" hidden><div class="row"><button id="usage">ดูโควตาจาก Server</button><button id="logout">Logout</button></div><input id="barcode" placeholder="TEST001"><input id="operation" placeholder="Recording ID" readonly><div class="row"><button id="reserve">ทดสอบจองเครดิต</button><button id="fail">คืนเครดิตที่จอง</button></div><p>ฟอร์มทดสอบเท่านั้น ไม่ได้บันทึกวิดีโอจริง</p></section><pre id="status" role="status">กรุณาตั้งค่า firebase-v4-config.js</pre></main><script type="module" src="firebase-v4.js"></script></body></html>
