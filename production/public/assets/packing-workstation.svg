 <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#061426" flood-opacity=".36"/></filter>
 <filter id="soft" x="-30%" y="-30%" width="170%" height="170%"><feGaussianBlur stdDeviation="25"/></filter>
 <clipPath id="round"><rect width="1000" height="680" rx="30"/></clipPath>
</defs>
