 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1a4b7f"/><stop offset="1" stop-color="#0e2a54"/></linearGradient>
 <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e3eafa"/><stop offset=".6" stop-color="#a9c5df"/><stop offset="1" stop-color="#7295b8"/></linearGradient>
 <linearGradient id="box" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfb87d"/><stop offset="1" stop-color="#a86c35"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#f4c4a2"/><stop offset="1" stop-color="#c8885d"/></linearGradient>
