<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="ptTitle ptDesc">
<title id="ptTitle">Packing station using the PACKTOOK recording system</title>
<desc id="ptDesc">An ecommerce worker packs a parcel at a workbench with an overhead camera, barcode scanner and PACKTOOK recording dashboard on a computer monitor.</desc>
<defs>
