name: P113 App Check Candidate Offline Regression
on:
  push:
    branches:
      - review/p113-appcheck-client-candidate
  pull_request:
    branches:
      - review/p112-appcheck-client-readiness-gate
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse backend and test scripts
        run: |
          node --check functions/index.js
          node --check audit/p111-status-appcheck-candidate.test.cjs
          node --check audit/p112-appcheck-client-readiness.cjs
          node --check audit/p113-appcheck-client-regression.cjs
      - name: Run P111 backend regression
        run: node audit/p111-status-appcheck-candidate.test.cjs
      - name: Verify P112 fail-closed gate (unprovisioned site key)
        shell: bash
        run: |
          set +e
          node audit/p112-appcheck-client-readiness.cjs > p112-gate.log 2>&1
          status=$?
          set -e
          cat p112-gate.log
          test "$status" -eq 1
          grep -Fq "BLOCK STAGING_SITE_KEY_PROVISIONED" p112-gate.log
          grep -Fq "P112_RESULT=NO_GO_STAGING" p112-gate.log
          grep -Fq "P112_COUNTS=10/11" p112-gate.log
      - name: Run P113 mocked App Check behavioral tests
        run: node audit/p113-appcheck-client-regression.cjs
