name: PACKTOOK P62 Consolidated NO GO CI (no deploy)
on:
  pull_request:
    branches: [review/p61-controlled-pilot-dryrun]
permissions:
  contents: read
jobs:
  readiness-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Verify no runtime wiring and execute negative gates
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "${OMISE_SECRET_KEY:-}"
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          ! grep -Eq 'p59-staging-proof-gates|p60-independent-approval-gates|p61-pilot-dryrun|p62-release-evidence' production/payment-functions/index.js
          node --test production/scripts/test-p59-staging-proof-gates.mjs production/scripts/test-p60-independent-approval-gates.mjs production/scripts/test-p61-pilot-dryrun.mjs production/scripts/test-p62-release-evidence.mjs
