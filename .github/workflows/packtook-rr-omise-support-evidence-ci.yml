name: PACKTOOK Omise Support Evidence Offline Validation
on:
  pull_request:
    branches: [review/rr-omise-404-error-code-safe-diagnostic]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline sanitized support evidence mock tests
        run: |
          set -Eeuo pipefail
          python3 -m unittest -v production/scripts/test-rr-omise-support-evidence.py
          python3 -m py_compile production/scripts/rr-omise-support-evidence.py
          echo 'SANITIZED_EVIDENCE_TEST: PASS'
          echo 'OMISE_REQUESTS: 0'
          echo 'GCP_WRITES: 0'
          echo 'RELEASE: NO_GO_RELEASE'
