name: P204 G02 Independent Security Evidence Intake Controls
on:
  push:
    branches: [review/p204-g02-independent-evidence-intake-controls]
  pull_request:
    branches: [review/p203-g02-independent-security-handoff]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-intake-no-go:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-packtook-p184
      GOOGLE_CLOUD_PROJECT: demo-packtook-p184
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate untrusted evidence intake and replay/forged-signoff denial
        run: |
          node --check audit/p204/intake.js
          node audit/p204/fixtures.js
      - name: Preserve independent handoff and original NO_GO release gates
        run: |
          node audit/p203/fixtures.js
          node audit/p202/fixtures.js
          node audit/p201/fixtures.js
          node audit/p188/build-rc.js
          node audit/p189/verify.js
          node audit/p190/reconcile-fixtures.js
          node audit/p180-fast-track-check.js
          node audit/p172-release-gates.js
