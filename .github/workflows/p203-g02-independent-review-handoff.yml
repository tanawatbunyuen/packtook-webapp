name: P203 G02 Independent Security Review Handoff
on:
  push:
    branches: [review/p203-g02-independent-security-handoff]
  pull_request:
    branches: [review/p202-g02-staging-security-evidence-consolidation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-independent-review-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-packtook-p184
      GOOGLE_CLOUD_PROJECT: demo-packtook-p184
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check forged independent review, source provenance and cross-project denial
        run: |
          node --check audit/p203/handoff.js
          node audit/p203/fixtures.js
      - name: Preserve offline review packet and no-go release gates
        run: |
          node audit/p202/fixtures.js
          node audit/p201/fixtures.js
          node audit/p200/fixtures.js
          node audit/p188/build-rc.js
          node audit/p189/verify.js
          node audit/p190/reconcile-fixtures.js
          node audit/p180-fast-track-check.js
          node audit/p172-release-gates.js
