name: PACKTOOK RR P48 Transaction and External-Gate Preflight (NO DEPLOY)
on:
  pull_request:
    branches:
      - review/rr-full-regression-suite-20261113
    paths:
      - 'production/scripts/rr-p48-real-handler-local-tx.mjs'
      - 'production/scripts/rr-final-external-gate-preflight.mjs'
      - 'production/docs/RR_FINAL_EXTERNAL_GATES_2026-11-13.md'
      - '.github/workflows/packtook-rr-final-preflight-ci.yml'
permissions:
  contents: read
concurrency:
  group: packtook-rr-final-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  local-charge-tx:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GCLOUD_PROJECT: demo-packtook-v72
      GOOGLE_CLOUD_PROJECT: demo-packtook-v72
      GCP_PROJECT: demo-packtook-v72
      FIRESTORE_EMULATOR_HOST: '127.0.0.1:18080'
      FIREBASE_AUTH_EMULATOR_HOST: '127.0.0.1:19099'
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - name: Deny production credentials and runtime wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GCLOUD_PROJECT}" = demo-packtook-v72
          test "${GOOGLE_CLOUD_PROJECT}" = demo-packtook-v72
          test "${GCP_PROJECT}" = demo-packtook-v72
          test "${FIRESTORE_EMULATOR_HOST}" = 127.0.0.1:18080
          test "${FIREBASE_AUTH_EMULATOR_HOST}" = 127.0.0.1:19099
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_TOKEN:-}"
          test -z "${OMISE_SECRET_KEY:-}"
          test -z "${PACKTOOK_PRODUCTION_PROJECT_ID:-}"
          ! grep -Eq 'rr-p48-real-handler-local-tx|rr-final-external-gate-preflight' production/payment-functions/index.js
          node --check production/scripts/rr-p48-real-handler-local-tx.mjs
      - name: Test external requirements without contacting any services
        run: node --test production/scripts/rr-final-external-gate-preflight.mjs
      - name: Install locked local Firebase SDK
        run: npm ci --prefix production/payment-functions --ignore-scripts --no-audit --no-fund
      - name: Run original charge reconciliation inside real Firestore emulator
        shell: bash
        run: |
          set -Eeuo pipefail
          npm exec --yes --package=firebase-tools@15.22.1 -- firebase emulators:exec \
            --project demo-packtook-v72 \
            --only auth,firestore \
            --config production/scripts/v72-isolated-emulators.firebase.json \
            'node production/scripts/rr-p48-real-handler-local-tx.mjs' | tee /tmp/rr-p48-tx.log
          grep -Fq 'P48_REAL_HANDLER_LOCAL_TX: 6/6 PASS' /tmp/rr-p48-tx.log
          grep -Fq 'P48_PRODUCTION_WRITES: 0' /tmp/rr-p48-tx.log
          grep -Fq 'P48_RELEASE: NO_GO_RELEASE' /tmp/rr-p48-tx.log
