name: PACKTOOK RR Omise staging Artifact Registry publish gate (DRY RUN ONLY)
on:
  pull_request:
    branches: [review/rr-omise-test-cloud-run-container-20261114]
permissions:
  contents: read
jobs:
  staging-image-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Guard no GCP secrets and verify immutable commit image plan
        shell: bash
        env:
          RR_STAGING_PROJECT_ID: packtook-staging
        run: |
          set -Eeuo pipefail
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_TOKEN:-}"
          test -z "${OMISE_SECRET_KEY:-}"
          test -z "${PACKTOOK_PRODUCTION_PROJECT_ID:-}"
          export RR_REVIEWED_COMMIT_SHA="$(git rev-parse HEAD)"
          python -m py_compile production/scripts/rr-publish-omise-staging-image.py
          python production/scripts/rr-publish-omise-staging-image.py | tee /tmp/rr-image-plan.log
          grep -Fq 'PUBLISH_DRY_RUN: PASS' /tmp/rr-image-plan.log
          grep -Fq 'GCP_WRITES: 0' /tmp/rr-image-plan.log
          grep -Fq 'STAGING_PROJECT: packtook-staging' /tmp/rr-image-plan.log
      - name: --publish must fail without separate explicit confirmation
        shell: bash
        env:
          RR_STAGING_PROJECT_ID: packtook-staging
        run: |
          set -Eeuo pipefail
          export RR_REVIEWED_COMMIT_SHA="$(git rev-parse HEAD)"
          set +e
          python production/scripts/rr-publish-omise-staging-image.py --publish >/tmp/rr-publish-deny.log 2>&1
          result=$?
          set -e
          test "${result}" -ne 0
          grep -Fq 'EXPLICIT_PUBLISH_CONFIRMATION_MISSING' /tmp/rr-publish-deny.log
          echo 'PUBLISH_WITHOUT_CONFIRMATION_DENIED: PASS'
      - name: wrong project must fail
        shell: bash
        env:
          RR_STAGING_PROJECT_ID: packtook-prod-01
        run: |
          set -Eeuo pipefail
          export RR_REVIEWED_COMMIT_SHA="$(git rev-parse HEAD)"
          set +e
          python production/scripts/rr-publish-omise-staging-image.py >/tmp/rr-project-deny.log 2>&1
          result=$?
          set -e
          test "${result}" -ne 0
          grep -Fq 'WRONG_PROJECT' /tmp/rr-project-deny.log
          echo 'PRODUCTION_PROJECT_DENIED: PASS'
      - name: old SHA must fail
        shell: bash
        env:
          RR_STAGING_PROJECT_ID: packtook-staging
          RR_REVIEWED_COMMIT_SHA: 0000000000000000000000000000000000000000
        run: |
          set -Eeuo pipefail
          set +e
          python production/scripts/rr-publish-omise-staging-image.py >/tmp/rr-sha-deny.log 2>&1
          result=$?
          set -e
          test "${result}" -ne 0
          grep -Fq 'REVIEWED_SHA_MUST_EQUAL_CHECKED_OUT_COMMIT' /tmp/rr-sha-deny.log
          echo 'UNREVIEWED_COMMIT_DENIED: PASS'
          echo 'ARTIFACT_REGISTRY_PUSH: NO'
          echo 'CLOUD_RUN_DEPLOY: NO'
          echo 'RELEASE: NO_GO_RELEASE'
