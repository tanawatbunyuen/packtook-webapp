name: PACKTOOK staging unauthenticated owner-role read-only gate
on:
  pull_request:
    branches: [review/rr-browser-appcheck-audit]
permissions:
  contents: read
jobs:
  deny-unauthenticated-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Assert no credentials and no production access
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "${OMISE_SECRET_KEY:-}"
          test -z "${FIREBASE_TOKEN:-}"
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${PACKTOOK_PRODUCTION_PROJECT_ID:-}"
          test -z "${RR_ENABLE_REAL_STAGING_PROBES:-}"
      - name: Install isolated Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Deny unauthenticated read-only accountRole
        shell: bash
        run: |
          set -Eeuo pipefail
          python production/scripts/rr-staging-unauth-role-browser.py | tee /tmp/unauth-role.log
          grep -Fq 'RR_UNAUTH_OWNER_ROLE_NO_DATA: PASS' /tmp/unauth-role.log
          grep -Fq 'RR_STAGING_UNAUTH_READONLY_SECURITY: PASS' /tmp/unauth-role.log
          grep -Fq 'RR_ACTUAL_OWNER_LOGIN: NOT_TESTED' /tmp/unauth-role.log
