name: P201 G02 Artifact Cleanup Evidence Review
on:
  push:
    branches: [review/p201-g02-artifact-cleanup-evidence]
  pull_request:
    branches: [review/p200-g02-real-run-revision-evidence]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-cleanup-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-packtook-p184
      GOOGLE_CLOUD_PROJECT: demo-packtook-p184
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check missing logs, 7-day policy and missing version are not proof of deletion
        run: |
          node --check audit/p201/verify.js
          node audit/p201/fixtures.js
      - name: Preserve exact source and offline NO_GO gates
        run: |
          node audit/p200/fixtures.js
          node audit/p199/fixtures.js
          node audit/p198/fixtures.js
          node audit/p189/verify.js
          node audit/p180-fast-track-check.js
          node audit/p172-release-gates.js
