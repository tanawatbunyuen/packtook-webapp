name: PACKTOOK V7 Controlled Staging Device Readiness
on:
  pull_request:
    branches: [review/rr-v6-staging-recorder-recovery-preflight]
permissions:
  contents: read
jobs:
  device-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Device preflight read-only browser tests
        run: |
          set -Eeuo pipefail
          node --test production/tests/rr-v7-browser-capability-offline.test.cjs | tee /tmp/v7-browser.log
          grep -Fq '# fail 0' /tmp/v7-browser.log
      - name: Pinned TypeScript AST parser and offline delta regression tests
        run: |
          set -Eeuo pipefail
          npm ci --prefix production/ast-review --ignore-scripts --no-audit --no-fund
          node --test production/ast-review/test-v7-ast-compare.cjs
          node --test production/ast-review/test-v7-ast-statement-security.cjs
          node --test production/ast-review/test-v7-callable-wrapper-security.cjs
      - name: Unified offline regression tests (one process)
        run: |
          set -Eeuo pipefail
          python3 -m unittest -v production/scripts/test-rr-v7-unified-offline-ci.py
          python3 production/scripts/rr-v7-unified-offline-ci.py
          echo 'V7_CONTROLLED_DEVICE_READINESS_CI: PASS'
          echo 'REMOTE_HOSTING_CALLS: 0'
          echo 'CAMERA_PERMISSION_REQUESTS: 0'
          echo 'FIRESTORE_WRITES: 0'
          echo 'CLOUD_DEPLOYS: 0'
          echo 'NO_GO_RELEASE'
