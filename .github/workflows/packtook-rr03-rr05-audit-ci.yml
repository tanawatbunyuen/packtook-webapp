name: PACKTOOK RR03 RR05 Security and Base Audit (no deploy)
on:
  pull_request:
    branches:
      - review/release-readiness-audit-20261113
    paths:
      - 'production/payment-functions/rr03-policy-governance-contract.cjs'
      - 'production/scripts/test-rr03-policy-governance.mjs'
      - 'production/scripts/test-rr05-release-base-static.mjs'
      - 'production/docs/RR03_RR05_AUDIT.md'
      - '.github/workflows/packtook-rr03-rr05-audit-ci.yml'
permissions:
  contents: read
jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Enforce read-only audit and execute security contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_TOKEN:-}"
          test -z "${OMISE_SECRET_KEY:-}"
          node --check production/payment-functions/rr03-policy-governance-contract.cjs
          node --test production/scripts/test-rr03-policy-governance.mjs production/scripts/test-rr05-release-base-static.mjs
