name: PACKTOOK RR Staging Candidate & Demo Rollback CI (NO DEPLOY)
on:
  pull_request:
    branches:
      - review/rr-final-staging-preflight-p48-tx
    paths:
      - 'production/payment-functions/rr-staging-readonly-omise-probe.cjs'
      - 'production/scripts/test-rr-staging-readonly-omise-probe.mjs'
      - 'production/scripts/rr-demo-rollback-firestore-emulator.mjs'
      - 'production/docs/RR_STAGING_ROLLBACK_HANDOFF.md'
      - '.github/workflows/packtook-rr-staging-rollback-ci.yml'
permissions:
  contents: read
concurrency:
  group: rr-staging-demo-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: |
          set -Eeuo pipefail
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_TOKEN:-}"
          test -z "${OMISE_SECRET_KEY:-}"
          test -z "${PACKTOOK_PRODUCTION_PROJECT_ID:-}"
          ! grep -Eq 'rr-staging-readonly-omise-probe|rr-demo-rollback-firestore-emulator' production/payment-functions/index.js
          node --test production/scripts/test-rr-staging-readonly-omise-probe.mjs
  local-rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GCLOUD_PROJECT: demo-packtook-v72
      GOOGLE_CLOUD_PROJECT: demo-packtook-v72
      GCP_PROJECT: demo-packtook-v72
      FIRESTORE_EMULATOR_HOST: '127.0.0.1:18080'
      FIREBASE_AUTH_EMULATOR_HOST: '127.0.0.1:19099'
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - name: Guard local project and no service credential
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GCLOUD_PROJECT}" = demo-packtook-v72
          test "${GOOGLE_CLOUD_PROJECT}" = demo-packtook-v72
          test "${GCP_PROJECT}" = demo-packtook-v72
          test "${FIRESTORE_EMULATOR_HOST}" = 127.0.0.1:18080
          test "${FIREBASE_AUTH_EMULATOR_HOST}" = 127.0.0.1:19099
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_TOKEN:-}"
          test -z "${OMISE_SECRET_KEY:-}"
          test -z "${PACKTOOK_PRODUCTION_PROJECT_ID:-}"
          node --check production/scripts/rr-demo-rollback-firestore-emulator.mjs
      - run: npm ci --prefix production/payment-functions --ignore-scripts --no-audit --no-fund
      - name: Perform local rollback rehearsal
        shell: bash
        run: |
          set -Eeuo pipefail
          npm exec --yes --package=firebase-tools@15.22.1 -- firebase emulators:exec \
            --project demo-packtook-v72 \
            --only auth,firestore \
            --config production/scripts/v72-isolated-emulators.firebase.json \
            'node production/scripts/rr-demo-rollback-firestore-emulator.mjs' | tee /tmp/rr-demo-rollback.log
          grep -Fq 'RR_DEMO_ROLLBACK: 6/6 PASS' /tmp/rr-demo-rollback.log
          grep -Fq 'RR_REAL_ROLLBACK_EXECUTED: false' /tmp/rr-demo-rollback.log
          grep -Fq 'RR_PRODUCTION_WRITES: 0' /tmp/rr-demo-rollback.log
          grep -Fq 'RR_RELEASE: NO_GO_RELEASE' /tmp/rr-demo-rollback.log
