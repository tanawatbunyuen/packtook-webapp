name: PACKTOOK P55 pure security gates (no deploy)
on:
  pull_request:
    branches:
      - review/p54-recovery-backend-candidate
    paths:
      - 'production/scripts/test-p55-recovery-gates.mjs'
      - 'production/docs/P55_RECOVERY_SECURITY_HARDENING.md'
      - '.github/workflows/packtook-p55-recovery-gates.yml'
permissions:
  contents: read
jobs:
  pure-security:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Assert P55 remains unexported and no credentials supplied
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_TOKEN:-}"
          test -z "${OMISE_SECRET_KEY:-}"
          if grep -Eq 'p55-recovery-gates|p54-recovery-backend-candidate' production/payment-functions/index.js; then exit 1; fi
      - name: Verify P55 pure negative security tests
        run: node --test production/scripts/test-p55-recovery-gates.mjs
