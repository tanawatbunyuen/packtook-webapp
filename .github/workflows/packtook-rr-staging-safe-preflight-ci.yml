name: PACKTOOK Staging safe preflight — public config and local security contracts
on:
  pull_request:
    branches: [review/rr-live-appcheck-token-browser]
permissions:
  contents: read
jobs:
  staging-safe-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Assert no service credentials / no production authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_TOKEN:-}"
          test -z "${OMISE_SECRET_KEY:-}"
          test -z "${PACKTOOK_PRODUCTION_PROJECT_ID:-}"
          test -z "${RR_ENABLE_REAL_STAGING_PROBES:-}"
          ! grep -Eq 'rr-staging-readonly-omise-probe|rr-authorized-staging-gate' production/payment-functions/index.js
      - name: Local staging gate and Omise TEST-only negative cases (mock provider)
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test production/scripts/test-rr-authorized-staging-gate.mjs production/scripts/test-rr-staging-readonly-omise-probe.mjs | tee /tmp/staging-safe-contracts.log
          grep -Fq '# fail 0' /tmp/staging-safe-contracts.log
      - name: Verify LIVE non-authenticated Staging config over HTTPS
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile production/scripts/rr-live-staging-config-preflight.py
          python production/scripts/rr-live-staging-config-preflight.py | tee /tmp/rr-live-config.log
          grep -Fq 'PUBLIC_READ_ONLY_STAGING_PREFLIGHT: PASS' /tmp/rr-live-config.log
          grep -Fq 'OMISE_TEST_SECRET_MANAGER: NOT_CONFIGURED' /tmp/rr-live-config.log
          grep -Fq 'RELEASE: NO_GO_RELEASE' /tmp/rr-live-config.log
