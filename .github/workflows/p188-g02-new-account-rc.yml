name: P188 G02 New Customer Provisioning Release Candidate
on:
  push:
    branches: [review/p188-g02-new-account-provisioning-rc]
  pull_request:
    branches: [review/p187-g02-staging-appcheck-attestation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GCLOUD_PROJECT: demo-packtook-p184
      GOOGLE_CLOUD_PROJECT: demo-packtook-p184
      FIREBASE_SKIP_UPDATE_CHECK: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install isolated emulator and functions SDK
        run: |
          npm install --prefix audit/p177-emulator --ignore-scripts --no-audit --no-fund --no-package-lock
          npm install --prefix audit/p184/runtime --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Build pinned G02 candidate only in disposable workspace
        run: |
          node audit/p188/build-rc.js
          node --check audit/p188/candidate-index.js
          cp audit/p188/candidate-index.js audit/p184/runtime/index.js
          cp firestore.rules audit/p184/firestore.rules
      - name: Run actual full Callable Auth Firestore runtime regressions
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:18094
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19094
        run: |
          audit/p177-emulator/node_modules/.bin/firebase emulators:exec --project demo-packtook-p184 --only auth,functions,firestore --config audit/p184/firebase.json "node audit/p184/test-callable.js && node audit/p188/test-new-account.js"
      - name: Keep production gates blocked
        run: |
          node audit/p174-authz-offline-fixtures.js
          node audit/p180-fast-track-check.js
          node audit/p172-release-gates.js
