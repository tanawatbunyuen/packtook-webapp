name: PACKTOOK RR Full Demo Regression Matrix (NO DEPLOY)
on:
  pull_request:
    branches:
      - review/rr03-rr05-security-base-audit
    paths:
      - 'production/scripts/test-rr-full-p48-wallet-source.mjs'
      - 'production/docs/RR_FULL_TEST_MATRIX_2026-11-13.md'
      - '.github/workflows/packtook-rr-full-regression-ci.yml'
permissions:
  contents: read
concurrency:
  group: packtook-rr-full-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pure-regression:
    name: All pure security, readiness and P48 source-helper tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: No secrets, no production and no missing suites
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_TOKEN:-}"
          test -z "${OMISE_SECRET_KEY:-}"
          test -z "${PACKTOOK_PRODUCTION_PROJECT_ID:-}"
          node --check production/scripts/test-rr-full-p48-wallet-source.mjs
          ! grep -Eq 'p54-recovery-backend-candidate|p58-policy-integrated-backend|p59-staging-proof-gates|p60-independent-approval-gates|p61-pilot-dryrun|p62-release-evidence' production/payment-functions/index.js
      - name: Run complete recovery pure test suite
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test \
            production/scripts/test-p54-recovery-security.mjs \
            production/scripts/test-p55-recovery-gates.mjs \
            production/scripts/test-p59-staging-proof-gates.mjs \
            production/scripts/test-p60-independent-approval-gates.mjs \
            production/scripts/test-p61-pilot-dryrun.mjs \
            production/scripts/test-p62-release-evidence.mjs \
            production/scripts/test-rr03-policy-governance.mjs \
            production/scripts/test-rr05-release-base-static.mjs \
            production/scripts/test-rr-full-p48-wallet-source.mjs | tee /tmp/rr-pure.log
          grep -Fq '# fail 0' /tmp/rr-pure.log
  all-real-demo-emulators:
    name: All four real local Firebase Auth and Firestore Emulator suites
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GCLOUD_PROJECT: demo-packtook-v72
      GOOGLE_CLOUD_PROJECT: demo-packtook-v72
      GCP_PROJECT: demo-packtook-v72
      FIRESTORE_EMULATOR_HOST: '127.0.0.1:18080'
      FIREBASE_AUTH_EMULATOR_HOST: '127.0.0.1:19099'
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - name: Isolated project and disabled real credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GCLOUD_PROJECT}" = demo-packtook-v72
          test "${GOOGLE_CLOUD_PROJECT}" = demo-packtook-v72
          test "${GCP_PROJECT}" = demo-packtook-v72
          test "${FIRESTORE_EMULATOR_HOST}" = 127.0.0.1:18080
          test "${FIREBASE_AUTH_EMULATOR_HOST}" = 127.0.0.1:19099
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_TOKEN:-}"
          test -z "${OMISE_SECRET_KEY:-}"
          test -z "${PACKTOOK_PRODUCTION_PROJECT_ID:-}"
      - name: Install locked local SDK
        run: npm ci --prefix production/payment-functions --ignore-scripts --no-audit --no-fund
      - name: Run P54 P56 P57 P58 against REAL local emulator
        shell: bash
        run: |
          set -Eeuo pipefail
          npm exec --yes --package=firebase-tools@15.22.1 -- firebase emulators:exec \
            --project demo-packtook-v72 \
            --only auth,firestore \
            --config production/scripts/v72-isolated-emulators.firebase.json \
            'node production/scripts/p54-recovery-backend-emulator.mjs && node production/scripts/p56-recovery-race-emulator.mjs && node production/scripts/p57-policy-epoch-race-emulator.mjs && node production/scripts/p58-policy-integration-emulator.mjs' | tee /tmp/rr-emulator.log
          grep -Fq 'P54_BACKEND_EMULATOR: 16/16 PASS' /tmp/rr-emulator.log
          grep -Fq 'P56_RACE_EMULATOR: 10/10 PASS' /tmp/rr-emulator.log
          grep -Fq 'P57_POLICY_EPOCH_EMULATOR: 9/9 PASS' /tmp/rr-emulator.log
          grep -Fq 'P58_INTEGRATION_EMULATOR: 19/19 PASS' /tmp/rr-emulator.log
          grep -Fq 'P58_ACTUAL_OMISE_REQUESTS: 0' /tmp/rr-emulator.log
          grep -Fq 'P58_CLOUD_ENDPOINTS_EXPORTED: 0' /tmp/rr-emulator.log
          echo 'RR_LOCAL_EMULATOR_AGGREGATE: 54/54 PASS'
