name: P224 G02 Firestore Safe Diagnostics
on:
  push:
    branches: [review/p224-g02-firestore-safe-diagnostics]
  pull_request:
    branches: [review/p223-g02-runtime-iam-verification]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-only-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-packtook-p184
      GOOGLE_CLOUD_PROJECT: demo-packtook-p184
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild pinned P188 and verify P224 local-only diagnostics
        run: |
          node audit/p188/build-rc.js
          node audit/p189/verify.js
          node audit/p224/predeploy.js
          node audit/p224/fixtures.js
          node --check audit/p224/probe/index.js
          bash -n audit/p224/deploy-staging.sh
      - name: Assert original no-go release posture
        run: |
          node audit/p223/predeploy.js
          node audit/p219/fixtures.js
          node audit/p180-fast-track-check.js
          node audit/p172-release-gates.js
