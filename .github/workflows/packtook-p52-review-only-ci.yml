name: PACKTOOK P52 Review-Only Dual Control CI (demo, no deploy)

on:
  pull_request:
    branches:
      - review/v73-wave9-credit-hardening
    paths:
      - 'production/payment-functions/payment-review-dual-control.cjs'
      - 'production/scripts/test-p52-payment-review-gate.mjs'
      - 'production/scripts/p52-demo-firestore-review.mjs'
      - 'production/scripts/P52_REVIEW_ONLY_README.md'
      - '.github/workflows/packtook-p52-review-only-ci.yml'

permissions:
  contents: read

concurrency:
  group: packtook-p52-review-only
  cancel-in-progress: true

jobs:
  review-only:
    name: Pure Gate + Demo Firestore Transaction Tests (no production credentials)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GCLOUD_PROJECT: demo-packtook-v72
      GOOGLE_CLOUD_PROJECT: demo-packtook-v72
      GCP_PROJECT: demo-packtook-v72
      FIRESTORE_EMULATOR_HOST: '127.0.0.1:18080'
      FIREBASE_CONFIG: '{"projectId":"demo-packtook-v72"}'
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
    steps:
      - name: Checkout review candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Java 21 for Firestore Emulator
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Require demo-only environment and exact source syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GCLOUD_PROJECT}" = demo-packtook-v72
          test "${GOOGLE_CLOUD_PROJECT}" = demo-packtook-v72
          test "${GCP_PROJECT}" = demo-packtook-v72
          test "${FIRESTORE_EMULATOR_HOST}" = 127.0.0.1:18080
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_TOKEN:-}"
          test -z "${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE:-}"
          test -z "${PACKTOOK_PRODUCTION_PROJECT_ID:-}"
          node --check production/payment-functions/payment-review-dual-control.cjs
          node --check production/scripts/test-p52-payment-review-gate.mjs
          node --check production/scripts/p52-demo-firestore-review.mjs

      - name: Pure review gate regression — 41 cases
        run: node --test production/scripts/test-p52-payment-review-gate.mjs

      - name: Install locked Firebase Admin dependencies (no scripts)
        shell: bash
        run: npm ci --prefix production/payment-functions --ignore-scripts --no-audit --no-fund

      - name: Real transactions in localhost demo Firestore Emulator only
        shell: bash
        run: |
          set -Eeuo pipefail
          npm exec --yes --package=firebase-tools@15.22.1 -- firebase emulators:exec \
            --project demo-packtook-v72 \
            --only firestore \
            --config production/scripts/v72-isolated-emulators.firebase.json \
            'node production/scripts/p52-demo-firestore-review.mjs' | tee /tmp/p52-review-only-demo.log
          grep -Fq 'P52_DEMO_FIRESTORE_TESTS: 8/8 PASS' /tmp/p52-review-only-demo.log
          grep -Fq 'P52_WALLET_WRITES: 0 | PAYMENT_SETTLEMENT: 0 | BILLING_LOCK_RELEASE: 0' /tmp/p52-review-only-demo.log
          echo 'P52_REVIEW_ONLY_CI: PASS; NO PRODUCTION DEPLOY OR WRITES'
