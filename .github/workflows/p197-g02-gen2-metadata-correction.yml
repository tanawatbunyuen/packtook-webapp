name: P197 G02 Gen2 Describe Metadata Correction
on:
  push:
    branches: [review/p197-g02-gen2-runtime-metadata-correction]
  pull_request:
    branches: [review/p196-g02-staging-operator-readonly-runtime]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-correction-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-packtook-p184
      GOOGLE_CLOUD_PROJECT: demo-packtook-p184
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assert official Gen2 function URL classification and no credential leakage
        run: |
          node audit/p196/operator-guards-fixtures.js
          node audit/p197-gen2-metadata-fixtures.js
      - name: Preserve release candidate pin and original NO_GO gates
        run: |
          node audit/p195/reconcile-fixtures.js
          node audit/p188/build-rc.js
          node audit/p189/verify.js
          node audit/p190/reconcile-fixtures.js
          node audit/p180-fast-track-check.js
          node audit/p172-release-gates.js
