name: PACKTOOK P71 Credit Semantic Parity Review
on:
  pull_request:
    branches: [review/p70-five-callable-staging-runtime-candidate]
  push:
    branches: [review/p71-credit-semantic-parity-review]
permissions:
  contents: read
jobs:
  p71-credit-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-packtook-p69
      GCP_PROJECT: demo-packtook-p69
      GOOGLE_CLOUD_PROJECT: demo-packtook-p69
      FIREBASE_AUTH_EMULATOR_HOST: "127.0.0.1:9199"
      FIRESTORE_EMULATOR_HOST: "127.0.0.1:8199"
    steps:
      - name: Checkout read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated candidate dependencies
        run: npm install --prefix production/staging-candidates/p69/functions --ignore-scripts --no-audit --no-fund
      - name: Install local Firebase Emulator CLI
        run: npm install --global firebase-tools@14.27.0 --ignore-scripts --no-audit --no-fund
      - name: Static parity audit and deliberate NO_GO review gate
        run: |
          node --test production/ast-review/test-p71-semantic-parity-review.cjs
          node production/ast-review/p71-semantic-parity-review.cjs production/functions/index.js production/staging-candidates/p69/functions/credit-handlers.cjs production/staging-candidates/p69/functions/index.js > /tmp/p71-audit.json
          node - <<'NODE'
          const a=require("/tmp/p71-audit.json");
          if(a.parityStatus!=="REVIEW_REQUIRED"||a.release!=="NO_GO_RELEASE")process.exit(2);
          console.log("P71_PARITY_REVIEW_REQUIRED");
          console.log("P71_RELEASE_NO_GO");
          NODE
      - name: Real Firestore emulator parity regressions
        run: firebase emulators:exec --only auth,firestore,functions --project demo-packtook-p69 --config production/staging-candidates/p69/firebase.json "node production/staging-candidates/p69/test-p70-credit-emulator.cjs && node production/staging-candidates/p69/test-p71-semantic-parity-emulator.cjs"
      - name: P71 cloud boundary
        if: always()
        run: |
          echo 'DEPLOY=0'
          echo 'STAGING_WRITES=0'
          echo 'PRODUCTION_WRITES=0'
          echo 'SEMANTIC_PARITY=REVIEW_REQUIRED'
          echo 'BACKEND_APP_CHECK=NOT_PROVEN'
          echo 'RELEASE=NO_GO_RELEASE'
