name: P211 G02 Real Firebase Auth Firestore Emulator Integration
on:
  push:
    branches: [review/p211-g02-auth-firestore-emulator-integration]
  pull_request:
    branches: [review/p210-g02-candidate-real-handler-authz-emulation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo-emulator-g02:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-packtook-p184
      GOOGLE_CLOUD_PROJECT: demo-packtook-p184
      FIREBASE_CONFIG: '{"projectId":"demo-packtook-p184"}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned Firebase Admin dependencies
        run: |
          npm install --prefix functions --no-package-lock --no-audit --no-fund
      - name: Build and pin isolated P188 candidate
        run: |
          node audit/p188/build-rc.js
          node audit/p189/verify.js
          node --check audit/p211/emulator-integration.js
      - name: Execute actual Firebase Auth Firestore emulators and candidate handlers
        run: |
          npx --yes firebase-tools@14 emulators:exec --project demo-packtook-p184 --config audit/p211/firebase.json --only auth,firestore "node audit/p211/emulator-integration.js"
      - name: Preserve G02 and release NO_GO
        run: |
          node audit/p210/real-handler-fixtures.js
          node audit/p209/fixtures.js
          node audit/p180-fast-track-check.js
          node audit/p172-release-gates.js
