name: P199 G02 Build Image Revision Digest Reconciliation
on:
  push:
    branches: [review/p199-g02-build-image-revision-reconciliation]
  pull_request:
    branches: [review/p198-g02-build-source-provenance-preflight]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-packtook-p184
      GOOGLE_CLOUD_PROJECT: demo-packtook-p184
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assert supplied Build fragment is insufficient and digest mismatch is denied
        run: |
          node --check audit/p199/verify.js
          node audit/p199/fixtures.js
      - name: Preserve prior security and NO_GO gates
        run: |
          node audit/p198/fixtures.js
          node audit/p197-gen2-metadata-fixtures.js
          node audit/p188/build-rc.js
          node audit/p189/verify.js
          node audit/p180-fast-track-check.js
          node audit/p172-release-gates.js
