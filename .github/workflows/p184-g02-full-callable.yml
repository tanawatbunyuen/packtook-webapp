name: P184 G02 Full Callable Runtime Emulator
on:
  push:
    branches: [review/p184-g02-full-callable-emulator]
  pull_request:
    branches: [review/p183-g02-integrated-backend-candidate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-real-callable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCLOUD_PROJECT: demo-packtook-p184
      GOOGLE_CLOUD_PROJECT: demo-packtook-p184
      FIREBASE_CLI_DISABLE_TELEMETRY: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install isolated pinned emulator and backend SDK dependencies
        run: |
          npm install --prefix audit/p177-emulator --ignore-scripts --no-audit --no-fund --no-package-lock
          npm install --prefix audit/p184/runtime --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Build pinned candidate and start real Functions/Auth/Firestore emulator
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:18094
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19094
        run: |
          node audit/p184/build-runtime.js
          node --check audit/p184/runtime/index.js
          audit/p177-emulator/node_modules/.bin/firebase emulators:exec --project demo-packtook-p184 --only auth,functions,firestore --config audit/p184/firebase.json "node audit/p184/test-callable.js"
      - name: Preserve historical source, G02 and all NO_GO release gates
        run: |
          node audit/p174-authz-offline-fixtures.js
          node audit/p180-fast-track-check.js
          node audit/p172-release-gates.js
