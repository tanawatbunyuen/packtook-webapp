name: P200 G02 Actual Cloud Run Revision Evidence Check
on:
  push:
    branches: [review/p200-g02-real-run-revision-evidence]
  pull_request:
    branches: [review/p199-g02-build-image-revision-reconciliation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-real-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-packtook-p184
      GOOGLE_CLOUD_PROJECT: demo-packtook-p184
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact operator-supplied revision fields and digest disagreement denial
        run: |
          node audit/p200/fixtures.js
      - name: Check all prior source/build guards and NO_GO release gates
        run: |
          node audit/p199/fixtures.js
          node audit/p198/fixtures.js
          node audit/p197-gen2-metadata-fixtures.js
          node audit/p188/build-rc.js
          node audit/p189/verify.js
          node audit/p180-fast-track-check.js
          node audit/p172-release-gates.js
