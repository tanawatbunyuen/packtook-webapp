name: P183 G02 Full Backend Candidate Local Emulator
on:
  push:
    branches: [review/p183-g02-integrated-backend-candidate]
  pull_request:
    branches: [review/p182-g02-owner-authz-runtime-emulator]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-backend-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GCLOUD_PROJECT: demo-packtook-g02-p183
      GOOGLE_CLOUD_PROJECT: demo-packtook-g02-p183
      FIREBASE_CLI_DISABLE_TELEMETRY: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install isolated Emulator test dependencies
        run: npm install --prefix audit/p177-emulator --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Build exact-source full-backend integrated candidate and run handler tests
        run: |
          node --check audit/p183/build-candidate.js
          node --check audit/p183/test-handlers.js
          node audit/p183/build-candidate.js
          audit/p177-emulator/node_modules/.bin/firebase emulators:exec --project demo-packtook-g02-p183 --only firestore --config audit/p177-emulator/firebase.json "node audit/p183/test-handlers.js"
      - name: Historical source pinned and all NO_GO preserved
        run: |
          node audit/p174-authz-offline-fixtures.js
          node audit/p180-fast-track-check.js
          node audit/p172-release-gates.js
