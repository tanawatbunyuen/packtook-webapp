name: P206 G02 Security Review Execution Preflight
on:
  push:
    branches: [review/p206-g02-security-execution-preflight]
  pull_request:
    branches: [review/p205-g02-evidence-gap-dashboard]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-security-execution-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-packtook-p184
      GOOGLE_CLOUD_PROJECT: demo-packtook-p184
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: P206 scope/pin/role/token-safety offline checks
        run: |
          node --check audit/p206/preflight.js
          node audit/p206/fixtures.js
      - name: Preserve previous independent review evidence and release NO_GO
        run: |
          node audit/p205/fixtures.js
          node audit/p204/fixtures.js
          node audit/p203/fixtures.js
          node audit/p202/fixtures.js
          node audit/p201/fixtures.js
          node audit/p188/build-rc.js
          node audit/p189/verify.js
          node audit/p190/reconcile-fixtures.js
          node audit/p180-fast-track-check.js
          node audit/p172-release-gates.js
