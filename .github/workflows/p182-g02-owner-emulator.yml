name: P182 G02 Persisted Owner Authz Emulator
on:
  push:
    branches: [review/p182-g02-owner-authz-runtime-emulator]
  pull_request:
    branches: [review/p181-root-rules-emulator-security-g01]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g02-localhost-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GCLOUD_PROJECT: demo-packtook-g02-p182
      GOOGLE_CLOUD_PROJECT: demo-packtook-g02-p182
      FIREBASE_CLI_DISABLE_TELEMETRY: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install isolated emulator tooling
        run: npm install --prefix audit/p177-emulator --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Real demo Firestore authorization / transaction tests
        run: |
          node --check audit/p182-g02-owner-authz-candidate.js
          node --check audit/p182-g02-owner-authz-emulator.js
          audit/p177-emulator/node_modules/.bin/firebase emulators:exec --project demo-packtook-g02-p182 --only firestore --config audit/p177-emulator/firebase.json "node audit/p182-g02-owner-authz-emulator.js"
      - name: Source provenance and release NO_GO
        run: |
          node audit/p174-authz-offline-fixtures.js
          node audit/p180-fast-track-check.js
          node audit/p172-release-gates.js
