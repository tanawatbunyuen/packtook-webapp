name: P210 G02 P188 Real Candidate Handler In-Memory Authorization
on:
  push:
    branches: [review/p210-g02-candidate-real-handler-authz-emulation]
  pull_request:
    branches: [review/p209-g02-gate-evidence-final-reconciliation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-p188-real-handler:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-packtook-p184
      GOOGLE_CLOUD_PROJECT: demo-packtook-p184
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build exact isolated P188 and test real handlers in in-memory simulator
        run: |
          node audit/p188/build-rc.js
          node audit/p189/verify.js
          node audit/p210/real-handler-fixtures.js
      - name: Keep authentic G02 and eight NO_GO release gates
        run: |
          node audit/p209/fixtures.js
          node audit/p208/fixtures.js
          node audit/p207/fixtures.js
          node audit/p190/reconcile-fixtures.js
          node audit/p180-fast-track-check.js
          node audit/p172-release-gates.js
