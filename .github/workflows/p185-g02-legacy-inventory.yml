name: P185 G02 Legacy Read Only Inventory Preflight
on:
  push:
    branches: [review/p185-g02-legacy-inventory-read-only]
  pull_request:
    branches: [review/p184-g02-full-callable-emulator]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-production-access:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCLOUD_PROJECT: demo-packtook-p185
      GOOGLE_CLOUD_PROJECT: demo-packtook-p185
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19095
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18087
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install demo-only emulator SDKs
        run: npm install --prefix audit/p177-emulator --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Read-only inventory, legacy classification and no mutation tests
        run: |
          node --check audit/p185-legacy-inventory.js
          node --check audit/p185-emulator-tests.js
          audit/p177-emulator/node_modules/.bin/firebase emulators:exec --project demo-packtook-p185 --only auth,firestore --config audit/p185/firebase.json "node audit/p185-emulator-tests.js"
      - name: Historical G02 security and full release gates
        run: |
          node audit/p174-authz-offline-fixtures.js
          node audit/p175-owner-migration-fixtures.js
          node audit/p176-owner-migration-cas-fixtures.js
          node audit/p180-fast-track-check.js
          node audit/p172-release-gates.js
