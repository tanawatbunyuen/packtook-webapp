name: PACKTOOK Omise Paid Wallet Real Handler Offline
on:
  pull_request:
    branches: [review/rr-omise-local-api-sandbox-ci]
permissions:
  contents: read
jobs:
  wallet:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Real billing handler in-memory Firestore transactions
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "${OMISE_SECRET_KEY:-}"
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          node --test production/tests/omise-payment-wallet-real-handler-offline.test.cjs | tee /tmp/wallet-tests.log
          grep -Fq '# fail 0' /tmp/wallet-tests.log
      - name: Existing synthetic Omise HTTP and 404 safeguards
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test production/omise-test-job/test-local-api-sandbox.cjs production/tests/omise-404-real-handler-offline.test.cjs | tee /tmp/sandbox-tests.log
          grep -Fq '# fail 0' /tmp/sandbox-tests.log
          echo 'WALLET_PAYMENT_IDEMPOTENCY: PASS'
          echo 'EXTERNAL_OMISE_REQUESTS: 0'
          echo 'FIRESTORE_EXTERNAL_WRITES: 0'
          echo 'STAGING_DEPLOY: NO'
          echo 'RELEASE: NO_GO_RELEASE'
