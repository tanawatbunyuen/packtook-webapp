name: PACKTOOK V4 Payment Firestore Emulator E2E
on:
  pull_request:
    branches: [review/rr-omise-v3-business-charge-switch-guard]
permissions:
  contents: read
jobs:
  emulator-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GCLOUD_PROJECT: demo-packtook-v4-e2e
      NODE_PATH: ${{ github.workspace }}/functions/node_modules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test-time Firebase SDK and emulator CLI
        run: |
          set -Eeuo pipefail
          npm install --prefix functions --no-audit --no-fund --ignore-scripts
          npm install --global firebase-tools@14.12.1 --no-audit --no-fund
      - name: Execute V4 billing handler with Firestore emulator
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${OMISE_SECRET_KEY:-}"
          test -z "${FIREBASE_TOKEN:-}"
          firebase emulators:exec --only firestore --project demo-packtook-v4-e2e \
            'node --test production/tests/omise-v4-firestore-emulator-e2e.test.cjs' \
            | tee /tmp/packtook-v4-e2e.log
          grep -Fq '# fail 0' /tmp/packtook-v4-e2e.log
          echo 'V4_FIRESTORE_EMULATOR_E2E: PASS'
          echo 'OMISE_EXTERNAL_CALLS: 0'
          echo 'PRODUCTION_WRITES: 0'
          echo 'NO_GO_RELEASE'
