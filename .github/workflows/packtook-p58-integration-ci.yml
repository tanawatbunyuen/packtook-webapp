name: PACKTOOK P58 Policy-Integrated Recovery Demo CI (no deploy)
on:
  pull_request:
    branches:
      - review/p57-recovery-auth-lease-validation
    paths:
      - 'production/payment-functions/p58-policy-integrated-backend.cjs'
      - 'production/scripts/p58-policy-integration-emulator.mjs'
      - 'production/docs/P58_POLICY_INTEGRATION_CANDIDATE.md'
      - '.github/workflows/packtook-p58-integration-ci.yml'
permissions:
  contents: read
concurrency:
  group: packtook-p58-demo-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  integration:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GCLOUD_PROJECT: demo-packtook-v72
      GOOGLE_CLOUD_PROJECT: demo-packtook-v72
      GCP_PROJECT: demo-packtook-v72
      FIRESTORE_EMULATOR_HOST: '127.0.0.1:18080'
      FIREBASE_AUTH_EMULATOR_HOST: '127.0.0.1:19099'
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - name: Require demo-only and no production wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GCLOUD_PROJECT}" = demo-packtook-v72
          test "${GOOGLE_CLOUD_PROJECT}" = demo-packtook-v72
          test "${GCP_PROJECT}" = demo-packtook-v72
          test "${FIRESTORE_EMULATOR_HOST}" = 127.0.0.1:18080
          test "${FIREBASE_AUTH_EMULATOR_HOST}" = 127.0.0.1:19099
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_TOKEN:-}"
          test -z "${OMISE_SECRET_KEY:-}"
          if grep -Eq 'p58-policy-integrated-backend|p58-policy-integration-emulator' production/payment-functions/index.js; then exit 1; fi
          node --check production/payment-functions/p58-policy-integrated-backend.cjs
          node --check production/scripts/p58-policy-integration-emulator.mjs
      - name: Install locked Firebase Admin SDK
        run: npm ci --prefix production/payment-functions --ignore-scripts --no-audit --no-fund
      - name: Execute real local Firebase Auth and Firestore emulators
        shell: bash
        run: |
          set -Eeuo pipefail
          npm exec --yes --package=firebase-tools@15.22.1 -- firebase emulators:exec \
            --project demo-packtook-v72 \
            --only auth,firestore \
            --config production/scripts/v72-isolated-emulators.firebase.json \
            'node production/scripts/p58-policy-integration-emulator.mjs' | tee /tmp/p58.log
          grep -Fq 'P58_INTEGRATION_EMULATOR: 19/19 PASS' /tmp/p58.log
          grep -Fq 'P58_ACCOUNT_BILLING_WRITES_BY_BACKEND: 0' /tmp/p58.log
          grep -Fq 'P58_ACTUAL_OMISE_REQUESTS: 0' /tmp/p58.log
          grep -Fq 'P58_CLOUD_ENDPOINTS_EXPORTED: 0' /tmp/p58.log
          grep -Fq 'P58_RELEASE: NO_GO_RELEASE PUBLIC_CLOSED' /tmp/p58.log
