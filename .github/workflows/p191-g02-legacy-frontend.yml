name: P191 G02 Legacy Owner Frontend Review Guard
on:
  push:
    branches: [review/p191-g02-legacy-owner-frontend-ux]
  pull_request:
    branches: [review/p190-g02-external-evidence-reconciliation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-packtook-p184
      GOOGLE_CLOUD_PROJECT: demo-packtook-p184
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend legacy owner role invariants and JS parse
        run: |
          node audit/p191-legacy-owner-frontend-fixtures.js
      - name: Verify exact backend candidate integrity and G02 NO_GO gates
        run: |
          node audit/p188/build-rc.js
          node audit/p189/verify.js
          node audit/p190/reconcile-fixtures.js
          node audit/p180-fast-track-check.js
          node audit/p172-release-gates.js
