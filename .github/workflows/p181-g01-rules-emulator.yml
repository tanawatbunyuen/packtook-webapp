name: P181 G01 Exact Root Rules Client Emulator
on:
  push:
    branches: [review/p181-root-rules-emulator-security-g01]
  pull_request:
    branches: [review/p180-production-fast-track-readiness]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  localhost-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GCLOUD_PROJECT: demo-packtook-g01-p181
      GOOGLE_CLOUD_PROJECT: demo-packtook-g01-p181
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18091
      FIREBASE_CLI_DISABLE_TELEMETRY: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install isolated pinned client emulator dependencies
        run: npm install --prefix audit/p181 --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Exact root rules client read/write authorization checks
        run: |
          node --check audit/p181/test.js
          audit/p181/node_modules/.bin/firebase emulators:exec --project demo-packtook-g01-p181 --only firestore --config audit/p181/firebase.json "node audit/p181/test.js"
      - name: Preserve NO_GO release gates
        run: |
          node audit/p180-fast-track-check.js
          node audit/p172-release-gates.js
