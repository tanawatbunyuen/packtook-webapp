name: P198 G02 Staging Build Source Provenance Preflight
on:
  push:
    branches: [review/p198-g02-build-source-provenance-preflight]
  pull_request:
    branches: [review/p197-g02-gen2-runtime-metadata-correction]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-source-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-packtook-p184
      GOOGLE_CLOUD_PROJECT: demo-packtook-p184
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify source/build metadata mapping and fail-closed operator command
        run: |
          node --check audit/p198/verify.js
          node --check audit/p198/operator-build-readonly.js
          node audit/p198/fixtures.js
      - name: Preserve P197/P196, pinned candidate and release gates
        run: |
          node audit/p197-gen2-metadata-fixtures.js
          node audit/p196/operator-guards-fixtures.js
          node audit/p188/build-rc.js
          node audit/p189/verify.js
          node audit/p180-fast-track-check.js
          node audit/p172-release-gates.js
