name: P196 G02 Operator Read-only Runtime Safeguards
on:
  push:
    branches: [review/p196-g02-staging-operator-readonly-runtime]
  pull_request:
    branches: [review/p195-g02-staging-runtime-review-preflight]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-operator-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-packtook-p184
      GOOGLE_CLOUD_PROJECT: demo-packtook-p184
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ensure no real cloud calls in CI and test operator denial gates
        run: |
          node --check audit/p196/operator-readonly-runtime.js
          node --check audit/p196/cli.js
          node audit/p196/operator-guards-fixtures.js
          if node audit/p196/cli.js --project=packtook-staging --read-only; then
            echo "P196_CI_CLOUD_ACCESS_GUARD_BYPASSED"; exit 1
          else
            echo "P196_CI_CLOUD_ACCESS_REFUSED=PASS"
          fi
      - name: Preserve Staging evidence and pinned candidate no-go checks
        run: |
          node audit/p195/reconcile-fixtures.js
          node audit/p188/build-rc.js
          node audit/p189/verify.js
          node audit/p190/reconcile-fixtures.js
          node audit/p180-fast-track-check.js
          node audit/p172-release-gates.js
