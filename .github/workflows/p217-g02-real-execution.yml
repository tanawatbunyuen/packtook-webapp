name: P217 Execute G02 Owner Tenant Security Tests
on:
  push:
    branches: [review/p217-g02-real-emulator-adversarial-execution]
  pull_request:
    branches: [review/p216-g02-source-archive-byte-verifier]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-demo-g02:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-packtook-p184
      GOOGLE_CLOUD_PROJECT: demo-packtook-p184
      FIREBASE_CONFIG: '{"projectId":"demo-packtook-p184"}'
      FUNCTIONS_EMULATOR: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install only demo-local SDK
        run: npm install --prefix functions --no-package-lock --no-audit --no-fund
      - name: Generate exact P188 and pin hash plus diff
        run: |
          node audit/p188/build-rc.js
          node audit/p189/verify.js
          node --check audit/p217/adversarial-g02.js
      - name: Run P217 real G02 tenant authorization against Firebase Auth Firestore Emulators
        run: |
          npx --yes firebase-tools@14 emulators:exec --project demo-packtook-p184 --config audit/p211/firebase.json --only auth,firestore "node audit/p217/adversarial-g02.js"
      - name: Rerun P212 callable HTTP against SDK onCall and real emulators
        run: |
          npx --yes firebase-tools@14 emulators:exec --project demo-packtook-p184 --config audit/p211/firebase.json --only auth,firestore "node audit/p212/http-integration.js"
      - name: Rerun P213 mutation checks against actual emulator
        run: |
          npx --yes firebase-tools@14 emulators:exec --project demo-packtook-p184 --config audit/p211/firebase.json --only auth,firestore "node audit/p213/authz-mutation-emulator.js"
      - name: Enforce G02 and all eight NO_GO release gates
        run: |
          node audit/p214/fixtures.js
          node audit/p215/fixtures.js
          node audit/p180-fast-track-check.js
          node audit/p172-release-gates.js
