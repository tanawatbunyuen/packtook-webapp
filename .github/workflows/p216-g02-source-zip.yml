name: P216 G02 Source ZIP Byte Verification Safety
on:
  push:
    branches: [review/p216-g02-source-archive-byte-verifier]
  pull_request:
    branches: [review/p215-g02-final-security-preflight]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-source-zip-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-packtook-p184
      GOOGLE_CLOUD_PROJECT: demo-packtook-p184
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build isolated exact candidate with no Cloud calls
        run: |
          node audit/p188/build-rc.js
          node audit/p189/verify.js
      - name: Execute local synthetic malicious ZIP tests only
        run: |
          python3 -m py_compile audit/p216/source_zip_verify.py audit/p216/fixtures.py
          python3 audit/p216/fixtures.py
      - name: Preserve P214/P215 evidence and release NO_GO
        run: |
          node audit/p214/fixtures.js
          node audit/p215/fixtures.js
          node audit/p180-fast-track-check.js
          node audit/p172-release-gates.js
