name: P179 Isolated Atomic Account Audit Emulator
on:
  push:
    branches: [review/p179-atomic-migration-audit-emulator]
  pull_request:
    branches: [review/p178-trusted-approval-audit-boundary]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo-emulator-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GCLOUD_PROJECT: demo-packtook-p179
      GOOGLE_CLOUD_PROJECT: demo-packtook-p179
      FIREBASE_CLI_DISABLE_TELEMETRY: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Isolated emulator installation
        run: npm install --prefix audit/p177-emulator --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: P179 account plus audit atomic transactions in localhost emulator only
        run: |
          node --check audit/p179-atomic-migration-audit-emulator.js
          audit/p177-emulator/node_modules/.bin/firebase emulators:exec --project demo-packtook-p179 --only firestore --config audit/p177-emulator/firebase.json "node audit/p179-atomic-migration-audit-emulator.js"
      - name: Inherited offline release blockers
        run: |
          node audit/p178-trusted-approval-fixtures.js
          node audit/p176-owner-migration-cas-fixtures.js
          node audit/p175-owner-migration-fixtures.js
          node audit/p174-authz-offline-fixtures.js
          node audit/p173-root-rules-fixtures.js
          node audit/p172-release-fixtures.js
          node audit/p172-release-gates.js
