name: PACKTOOK V5 Full Credit Lifecycle Recovery Emulator
on:
  pull_request:
    branches: [review/rr-v4-paid-billing-credit-audit-readonly]
permissions:
  contents: read
jobs:
  credit-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GCLOUD_PROJECT: demo-packtook-v5-lifecycle
      NODE_PATH: ${{ github.workspace }}/functions/node_modules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated test dependencies
        run: |
          set -Eeuo pipefail
          npm install --prefix functions --no-audit --no-fund --ignore-scripts
          npm install --global firebase-tools@14.12.1 --no-audit --no-fund
      - name: Verify actual credit lifecycle in local Firestore Emulator
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${OMISE_SECRET_KEY:-}"
          test -z "${FIREBASE_TOKEN:-}"
          firebase emulators:exec --only firestore --project demo-packtook-v5-lifecycle \
            'node --test production/tests/omise-v5-credit-lifecycle-recovery-emulator.test.cjs' \
            | tee /tmp/packtook-v5-lifecycle.log
          grep -Fq '# fail 0' /tmp/packtook-v5-lifecycle.log
          echo 'V5_CREDIT_LIFECYCLE_RECOVERY: PASS'
          echo 'EXTERNAL_OMISE_CALLS: 0'
          echo 'REAL_FIRESTORE_WRITES: 0'
          echo 'RELEASE_DECISION: NO_GO_RELEASE'
