name: P212 G02 Local Firebase Callable HTTP Authorization
on:
  push:
    branches: [review/p212-g02-callable-http-auth-boundary]
  pull_request:
    branches: [review/p211-g02-auth-firestore-emulator-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo-callable-http:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-packtook-p184
      GOOGLE_CLOUD_PROJECT: demo-packtook-p184
      FIREBASE_CONFIG: '{"projectId":"demo-packtook-p184"}'
      FUNCTIONS_EMULATOR: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install local SDK dependencies
        run: |
          npm install --prefix functions --no-package-lock --no-audit --no-fund
      - name: Build pinned P188 and inspect HTTP adapter
        run: |
          node audit/p188/build-rc.js
          node audit/p189/verify.js
          node --check audit/p212/http-integration.js
      - name: Run real onCall local HTTP with Firebase Auth and Firestore emulators
        run: |
          npx --yes firebase-tools@14 emulators:exec --project demo-packtook-p184 --config audit/p211/firebase.json --only auth,firestore "node audit/p212/http-integration.js"
      - name: Verify prior G02 mock/emulator and release fail-closed
        run: |
          npx --yes firebase-tools@14 emulators:exec --project demo-packtook-p184 --config audit/p211/firebase.json --only auth,firestore "node audit/p211/emulator-integration.js"
          node audit/p210/real-handler-fixtures.js
          node audit/p209/fixtures.js
          node audit/p180-fast-track-check.js
          node audit/p172-release-gates.js
