name: P189 G02 Exact Release Candidate Integrity
on:
  push:
    branches: [review/p189-g02-release-evidence-integrity]
  pull_request:
    branches: [review/p188-g02-new-account-provisioning-rc]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-security-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GCLOUD_PROJECT: demo-packtook-p184
      GOOGLE_CLOUD_PROJECT: demo-packtook-p184
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate candidate from pinned original without Firebase secrets
        run: |
          node audit/p188/build-rc.js
          node --check audit/p188/candidate-index.js
      - name: Verify six exact source changes, export parity and negative mutations
        run: |
          node audit/p189/verify.js
      - name: Source history intact and production NO_GO stays in force
        run: |
          node audit/p174-authz-offline-fixtures.js
          node audit/p180-fast-track-check.js
          node audit/p172-release-gates.js
