name: P213 G02 Real Emulator Authz Mutation Coverage
on:
  push:
    branches: [review/p213-g02-authz-mutation-coverage]
  pull_request:
    branches: [review/p212-g02-callable-http-auth-boundary]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo-g02-authz-mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-packtook-p184
      GOOGLE_CLOUD_PROJECT: demo-packtook-p184
      FIREBASE_CONFIG: '{"projectId":"demo-packtook-p184"}'
      FUNCTIONS_EMULATOR: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Firebase SDK for demo emulator
        run: |
          npm install --prefix functions --no-package-lock --no-audit --no-fund
      - name: Validate pinned P188, six-edit diff and mutation harness
        run: |
          node audit/p188/build-rc.js
          node audit/p189/verify.js
          node --check audit/p213/authz-mutation-emulator.js
      - name: Test Owner tenant authorization mutation survival against real Auth Firestore emulators
        run: |
          npx --yes firebase-tools@14 emulators:exec --project demo-packtook-p184 --config audit/p211/firebase.json --only auth,firestore "node audit/p213/authz-mutation-emulator.js"
      - name: Preserve actual prior callable protocol and NO_GO release safety
        run: |
          npx --yes firebase-tools@14 emulators:exec --project demo-packtook-p184 --config audit/p211/firebase.json --only auth,firestore "node audit/p212/http-integration.js"
          node audit/p210/real-handler-fixtures.js
          node audit/p209/fixtures.js
          node audit/p180-fast-track-check.js
          node audit/p172-release-gates.js
