name: P205 G02 Evidence Gap Dashboard
on:
  push:
    branches: [review/p205-g02-evidence-gap-dashboard]
  pull_request:
    branches: [review/p204-g02-independent-evidence-intake-controls]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-dashboard-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-packtook-p184
      GOOGLE_CLOUD_PROJECT: demo-packtook-p184
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test evidence gap dashboard, rejected claims and no-go latch
        run: |
          node --check audit/p205/dashboard.js
          node --check audit/p205/cli.js
          node audit/p205/fixtures.js
          node audit/p205/cli.js
      - name: Check earlier intake and immutable release blockers
        run: |
          node audit/p204/fixtures.js
          node audit/p203/fixtures.js
          node audit/p202/fixtures.js
          node audit/p188/build-rc.js
          node audit/p189/verify.js
          node audit/p190/reconcile-fixtures.js
          node audit/p180-fast-track-check.js
          node audit/p172-release-gates.js
